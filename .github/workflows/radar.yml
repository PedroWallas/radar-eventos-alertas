name: Radar de Eventos 24h

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos, 24h por dia (horário UTC)
  workflow_dispatch:           # botão "Run workflow" para rodar na hora
    inputs:
      teste:
        description: "Mandar uma mensagem de teste em todos os canais"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [".github/workflows/radar.yml", "monitor.py", "buscas.py", "fontes.py"]  # roda na hora quando o código muda

permissions:
  contents: write

concurrency:
  group: radar-eventos
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar novidades e avisar no WhatsApp
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'radar-ape-pedro-7391' }}
          GREENAPI_URL: ${{ secrets.GREENAPI_URL }}
          GREENAPI_INSTANCE: ${{ secrets.GREENAPI_INSTANCE }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          ENVIAR_TESTE: ${{ inputs.teste && '1' || '' }}
          FONTES: ${{ github.event_name != 'schedule' && '1' || '' }}
        run: python monitor.py
      - name: Salvar o que já foi visto
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add estado
          git diff --cached --quiet || git commit -m "radar: atualiza estado $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push || true
