name: Testar fontes oficiais

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler cada fonte
        run: python ferramentas/testar_fontes.py
      - name: Ver o que o vigia extrai
        run: python ferramentas/testar_extracao.py
      - name: Salvar resultado
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add estado/teste_fontes.json estado/fontes_extracao.json
          git diff --cached --quiet || git commit -m "teste: leitura das fontes oficiais"
          git pull --rebase --autostash || true
          git push || true
